plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.severmax.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.severmax.app"
        minSdk 26
        targetSdk 34
        versionCode 20
        versionName "2.0"
    }

    // Постоянный ключ: каждая новая сборка ставится поверх старой без удаления.
    signingConfigs {
        shared {
            storeFile file('signing/severmax.jks')
            storeType 'pkcs12'
            storePassword 'severmax'
            keyAlias 'severmax'
            keyPassword 'severmax'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
